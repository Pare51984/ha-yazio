name: Release

# Creates tag + GitHub release whenever the version in manifest.json
# changes on main and no release for that version exists yet.
on:
  push:
    branches: [main]
    paths:
      - "custom_components/yazio/manifest.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "import json;print(json.load(open('custom_components/yazio/manifest.json'))['version'])")
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, nothing to do."
            exit 0
          fi
          NOTES_FILE="release-notes/$TAG.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
