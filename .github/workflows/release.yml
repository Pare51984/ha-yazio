name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python3 -c "import json;print(json.load(open('custom_components/yazio/manifest.json'))['version'])")
          if [ "$TAG" != "$VER" ]; then echo "Tag $TAG != manifest $VER"; exit 1; fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
