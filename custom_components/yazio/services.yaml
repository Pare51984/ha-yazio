import_weight_history:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: yazio
    start_date:
      required: false
      example: "2022-01-01"
      selector:
        date:

add_water:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: yazio
    amount:
      required: true
      example: 250
      selector:
        number:
          min: 1
          max: 5000
          unit_of_measurement: mL

add_weight:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: yazio
    weight:
      required: true
      example: 82.5
      selector:
        number:
          min: 20
          max: 400
          step: 0.1
          unit_of_measurement: kg
    when:
      required: false
      selector:
        datetime:

add_food:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: yazio
    name:
      required: true
      example: "Protein shake"
      selector:
        text:
    calories:
      required: true
      example: 350
      selector:
        number:
          min: 0
          max: 10000
          unit_of_measurement: kcal
    protein:
      required: false
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: g
    fat:
      required: false
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: g
    carbs:
      required: false
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: g
    meal:
      required: true
      default: snack
      selector:
        select:
          options:
            - breakfast
            - lunch
            - dinner
            - snack
